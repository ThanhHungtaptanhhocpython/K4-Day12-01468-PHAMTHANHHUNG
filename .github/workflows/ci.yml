name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest
        # Chạy test nhưng bỏ qua test_cp5 (cần chạy docker compose) và test bonus
        run: |
          pytest -v -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py
          
      - name: Test Docker Build
        run: |
          docker build -t day12-chat:test .

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy
        # Dùng Hook URL của Render để báo nó tự động kéo code mới về deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
